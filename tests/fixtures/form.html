<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }
        button[type="submit"] {
            background-color: #28a745;
        }
        button.danger {
            background-color: #dc3545;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Test Form Page</h1>
    <p>This is a test page for browser automation integration tests.</p>
    
    <form id="test-form">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
        </div>
        
        <div class="form-group">
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="">Select a country</option>
                <option value="us">United States</option>
                <option value="uk">United Kingdom</option>
                <option value="ca">Canada</option>
                <option value="au">Australia</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" placeholder="Enter your message"></textarea>
        </div>
        
        <div class="form-group">
            <button type="button" id="info-button">Info</button>
            <button type="button" id="cancel-button">Cancel</button>
            <button type="submit" id="submit-button">Submit</button>
            <button type="button" id="delete-button" class="danger">Delete</button>
        </div>
    </form>
    
    <div id="result" class="hidden">
        <h2>Result</h2>
        <p id="result-text"></p>
    </div>
    
    <div id="dynamic-content" class="hidden">
        <p>This content appears after clicking the info button.</p>
    </div>
    
    <script>
        document.getElementById('info-button').addEventListener('click', function() {
            document.getElementById('dynamic-content').classList.remove('hidden');
        });
        
        document.getElementById('cancel-button').addEventListener('click', function() {
            document.getElementById('test-form').reset();
        });
        
        document.getElementById('test-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const country = document.getElementById('country').value;
            const message = document.getElementById('message').value;
            
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('result-text').textContent = 
                `Form submitted! Name: ${name}, Email: ${email}, Country: ${country}, Message: ${message}`;
        });
        
        document.getElementById('delete-button').addEventListener('click', function() {
            if (confirm('Are you sure you want to delete?')) {
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('result-text').textContent = 'Item deleted.';
            }
        });
    </script>
</body>
</html>
