  <script>
    const tl = gsap.timeline({ paused: true });

    // panel + goal arrive quietly
    tl.fromTo(
      "#panel-inner",
      { opacity: 0, y: 22 },
      { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      0.15,
    );

    const stepIn = (sel, t) => {
      tl.fromTo(
        sel,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" },
        t,
      );
    };

    // the plan unfolds one step at a time
    stepIn("#st-plan", 0.85);
    stepIn("#st-code", 1.3);

    // high-risk step pauses at the human gate — the hold is the joke
    tl.fromTo(
      "#chip-wait",
      { opacity: 0, scale: 0.92 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
      1.65,
    );
    // approval resolves (sfx-gate lands here, abs ~13.6s)
    tl.set("#chip-wait", { display: "none" }, 4.1);
    tl.set("#chip-ok", { display: "inline-block" }, 4.1);
    tl.fromTo(
      "#chip-ok",
      { opacity: 0, scale: 0.92 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
      4.12,
    );
    tl.to("#dot-code", { backgroundColor: "#2a6b45", borderColor: "#2a6b45", duration: 0.3 }, 4.1);

    // execution resumes
    stepIn("#st-browser", 4.45);
    tl.to("#dot-browser", { backgroundColor: "#2a6b45", duration: 0.3 }, 5.05);
    tl.set("#st-browser-run", { display: "none" }, 5.1);
    tl.set("#st-browser-done", { display: "inline" }, 5.1);

    stepIn("#st-write", 4.85);
    tl.to("#dot-write", { backgroundColor: "#2a6b45", borderColor: "#2a6b45", duration: 0.3 }, 5.35);
    tl.set("#st-write-status", { display: "inline" }, 5.35);

    stepIn("#st-check", 5.15);

    stepIn("#st-synth", 5.5);
    tl.to("#dot-synth", { backgroundColor: "#2a6b45", borderColor: "#2a6b45", duration: 0.3 }, 5.85);
    tl.set("#st-synth-status", { display: "inline" }, 5.85);

    // the payoff: real synthesized answer from the actual run
    tl.fromTo(
      "#answer-block",
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      5.8,
    );

    // exit into the receipts scene
    tl.to("#panel-inner", { opacity: 0, duration: 0.45, ease: "power1.in" }, 6.5);

    window.__timelines["scene3"] = tl;
  </script>
