name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit & integration test suite (fast / non-live)
      env:
        ANTHROPIC_API_KEY: "mock_test_key"
        GROQ_API_KEY: "mock_test_key"
        OPENROUTER_API_KEY: "mock_test_key"
        TAVILY_API_KEY: "mock_test_key"
      run: |
        python -m pytest -m "not live" --maxfail=5
